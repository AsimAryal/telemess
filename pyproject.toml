[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemess"
version = "0.1.0"
description = "The drawing game where things go hilariously wrong"
authors = [{ name = "Your Name", email = "your@email.com" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "pre-commit>=3.0.0",
]
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
telemess = "telemess.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/telemess"]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox",
    ".pants.d", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__",
    "_build", "buck-out", "build", "dist", "node_modules", "venv",
]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
